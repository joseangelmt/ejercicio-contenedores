# Docker Compose moderno - No se requiere el campo 'version'

services:
  # Definimos servicio de aplicación FastAPI
  app:
    container_name: estudiantes-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+psycopg2://user:password@estudiantes-db:5432/mydb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Definir servicio de base de datos
  db:
    image: postgres:16-alpine
    container_name: estudiantes-db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

# Definimos la red personalizada
networks:
  app-network:
    driver: bridge

# Definimos el volumen con nombre personalizado
volumes:
  db_data:
    name: my_database_volume